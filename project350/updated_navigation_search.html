<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Universities</title>
    <style>
        /* Global Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
        }

        /* Top Bar (Logo and Navigation) */
        .top-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 2.5rem;
            background-color: #FFFFFF;
            border-bottom: 1px solid #e0e0e0;
            position: relative;
        }
        .top-bar .logo {
            position: absolute;
            left: 2rem;
        }
        .top-bar .logo img {
            height: 50px;
            width: auto;
        }
        .top-bar .menu {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }
        .top-bar .menu a {
            color: #000000;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .top-bar .menu a:hover {
            color: #05350e;
        }

        /* Form Styles */
        .form-container {
            background-color: #FFFFFF;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin: 2rem auto;
            max-width: 600px;
        }
        form label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        form input, form button {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        form button {
            background-color: #05350e;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease-in-out;
        }
        form button:hover {
            background-color: #000000;
        }

        /* Results Section */
        .results {
            margin: 2rem auto;
            max-width: 600px;
        }
        .result-item {
            background-color: white;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 1rem;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .result-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }
        .result-item h3 {
            color: #05350e;
        }

        /* Footer */
        footer {
            background-color: #FFFFFF;
            color: #000000;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }
        footer a {
            color: #05350e;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <a href="#" class="logo">
            <img src="Logoedu4you.jpeg" alt="EDU4YOU Logo">
        </a>
        <div class="menu">
            <a href="EDU4YOU_Main_Prototype_Finalized.php">Home</a>
            <a href="updated_navigation_search.html">Search Universities</a>
            <a href="updated_navigation_compare.html">Compare Colleges</a>
            <a href="updated_navigation_majors.html">Explore Majors</a>
        </div>
    </div>

    <!-- Form Section -->
    <div class="form-container">
        <form id="searchForm">
            <label for="gpa">Minimum GPA:</label>
            <input type="number" step="0.1" id="gpa" name="gpa" placeholder="e.g., 3.0">

            <label for="tuition">Maximum Tuition:</label>
            <input type="number" id="tuition" name="tuition" placeholder="e.g., 20000">

            <label for="location">Location:</label>
            <input type="text" id="location" name="location" placeholder="e.g., New York">

            <button type="button" onclick="performSearch()">Search</button>
        </form>
    </div>

    <!-- Results Section -->
    <div class="results">
        <h2>Search Results</h2>
        <div id="resultItems">
            <p>No results yet. Start your search above!</p>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 EDU4YOU. All rights reserved. <a href="privacy.html">Privacy Policy</a></p>
    </footer>

    <script>
        function performSearch() {
            const resultsDiv = document.getElementById('resultItems');
            resultsDiv.innerHTML = `
                <div class="result-item">
                    <h3>Example University</h3>
                    <p>GPA: 3.5 | Tuition: $20,000 | Location: New York</p>
                </div>
                <div class="result-item">
                    <h3>Another University</h3>
                    <p>GPA: 3.2 | Tuition: $18,000 | Location: California</p>
                </div>
            `;
        }
    </script>
</body>
</html>
