<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Colleges</title>
    <style>
        /* Global Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
        }

        /* Top Bar (Logo and Navigation) */
        .top-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 2.5rem;
            background-color: #FFFFFF;
            border-bottom: 1px solid #e0e0e0;
            position: relative;
        }
        .top-bar .logo {
            position: absolute;
            left: 2rem;
        }
        .top-bar .logo img {
            height: 50px;
            width: auto;
        }
        .top-bar .menu {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }
        .top-bar .menu a {
            color: #000000;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .top-bar .menu a:hover {
            color: #05350e;
        }

        /* Main Content */
        main {
            padding: 2rem;
        }

        /* Add College Section */
        .add-college {
            margin: 2rem 0;
            text-align: center;
            background-color: #FFFFFF;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .add-college input, .add-college button {
            padding: 0.8rem;
            margin: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 200px;
        }
        .add-college button {
            background-color: #05350e;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease-in-out;
        }
        .add-college button:hover {
            background-color: #000000;
        }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 2rem;
            background-color: #FFFFFF;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        table th, table td {
            border: 1px solid #ccc;
            padding: 1rem;
            text-align: center;
        }
        table th {
            background-color: #05350e;
            color: #FFFFFF;
        }

        /* Footer */
        footer {
            background-color: #FFFFFF;
            color: #000000;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }
        footer a {
            color: #05350e;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <a href="#" class="logo">
            <img src="Logoedu4you.jpeg" alt="EDU4YOU Logo">
        </a>
        <div class="menu">
            <a href="EDU4YOU_Main_Prototype_Finalized.php">Home</a>
            <a href="updated_navigation_search.html">Search Universities</a>
            <a href="updated_navigation_compare.html">Compare Colleges</a>
            <a href="updated_navigation_majors.html">Explore Majors</a>
        </div>
    </div>

    <!-- Main Section -->
    <main>
        <div class="add-college">
            <h2>Add Universities to Compare</h2>
            <input type="text" id="universityName" placeholder="University Name">
            <button onclick="addToCompare()">Add to Compare</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>University</th>
                    <th>GPA Requirement</th>
                    <th>Tuition</th>
                    <th>Top Majors</th>
                </tr>
            </thead>
            <tbody id="comparisonTable">
                <tr>
                    <td colspan="4">No universities added yet. Use the form above to add some!</td>
                </tr>
            </tbody>
        </table>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 EDU4YOU. All rights reserved. <a href="privacy.html">Privacy Policy</a></p>
    </footer>

    <script>
        function addToCompare() {
            const universityName = document.getElementById('universityName').value;
            const comparisonTable = document.getElementById('comparisonTable');

            if (universityName) {
                const newRow = document.createElement('tr');
                newRow.innerHTML = `
                    <td>${universityName}</td>
                    <td>3.5</td>
                    <td>$20,000</td>
                    <td>Computer Science, Business</td>
                `;
                comparisonTable.appendChild(newRow);

                // Remove placeholder row if exists
                const placeholderRow = comparisonTable.querySelector('tr td[colspan="4"]');
                if (placeholderRow) {
                    placeholderRow.parentElement.removeChild(placeholderRow);
                }
            }
        }
    </script>
</body>
</html>
